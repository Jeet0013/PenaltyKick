<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover so the game can reach under a phone's notch and home
      indicator; the CSS uses env(safe-area-inset-*) to keep controls clear of
      them. maximum-scale=1 because a pinch-zoom during a run-up is never
      intended — the drag is an aiming gesture, not a page interaction.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1410" />
    <meta name="description" content="Penalty Kick — a 3D penalty shootout for the browser." />
    <title>Penalty Kick</title>
    <style>
      :root {
        color-scheme: dark;
        /* Placeholders only. The real palette arrives with the art direction. */
        --pitch: #0b1410;
        --ink: #f2f4f0;
        --muted: #8e988f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--pitch);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* Touch drags are the aiming control — never let them scroll the page. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /*
       * Boot overlay, removed once the engine reports ready.
       *
       * Markup rather than something the bundle renders, because it has to be
       * on screen before the bundle has parsed — which on a phone over mobile
       * data is the longest part of the wait.
       */
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        text-align: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 40%, #16261d, var(--pitch) 70%);
        transition: opacity 0.4s ease;
      }

      #boot[hidden] {
        display: none;
      }

      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot__title {
        margin: 0;
        font-size: clamp(1.4rem, 4.5vw, 2.2rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .boot__status {
        margin: 0;
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.2em;
      }

      .boot__ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid rgba(242, 244, 240, 0.18);
        border-top-color: rgba(242, 244, 240, 0.75);
        animation: boot-spin 0.9s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot__ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <h1 class="boot__title">Penalty Kick</h1>
        <div class="boot__ring" aria-hidden="true"></div>
        <p class="boot__status" id="boot-status" role="status">Starting…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
